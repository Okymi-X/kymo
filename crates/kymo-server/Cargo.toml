[package]
name = "kymo-server"
description = "HTTP API and persistence for Kymo"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kymo-engine = { path = "../kymo-engine" }
kymo-core = { path = "../kymo-core" }
kymo-instances = { path = "../kymo-instances", features = ["docker"] }
kymo-jeopardy = { path = "../kymo-jeopardy" }
kymo-monitor = { path = "../kymo-monitor" }
kymo-vpn = { path = "../kymo-vpn", features = ["docker"] }
base64 = "0.22"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-core = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
sha2 = "0.10"
rand = "0.9"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace"] }
rust-embed = "8"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
