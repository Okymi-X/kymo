[package]
name = "kymo-verifier"
description = "Kymo Verifier: checks a player's repair of a challenge machine against a definition written by the organizer, and releases the flag when every check passes"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "process", "io-util", "fs"] }
axum = "0.8"
libc = "0.2"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[[bin]]
name = "kymo-verifier"
path = "src/bin/kymo-verifier.rs"
