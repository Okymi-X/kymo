[package]
name = "kymo-instances"
description = "Challenge instance lifecycle: policy, state machine, runtime trait"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
docker = ["dep:bollard", "dep:futures-util"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "net", "time"] }
bollard = { version = "0.19", optional = true }
futures-util = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"] }
