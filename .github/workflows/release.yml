name: Release

# A release is made automatically: when `version` in Cargo.toml has no matching v* tag yet, the
# next push to main builds the server and publishes it as that GitHub release, creating the tag.
# To release, bump the version in Cargo.toml and merge. A v* tag pushed by hand also works,
# and the workflow can be run manually from the Actions tab.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          tag="v$version"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Publish when this tag is new, or when a tag was pushed by hand.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] || ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists, nothing to publish."
          fi

  build:
    needs: check
    if: needs.check.outputs.publish == 'true'
    # An older Ubuntu keeps the binary's glibc requirement low, so it runs on current Debian,
    # Ubuntu and most other distributions.
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # The front end is embedded in the binary, so it is built first.
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Never publish a build whose tests fail.
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p kymo-server -p kymo-lab -p kymo-verifier
      - name: Package
        run: |
          # The platform, with the lab host and its installer alongside.
          name="kymo-${TAG}-linux-x86_64"
          mkdir "$name"
          cp target/release/kymo-server target/release/kymo-lab "$name/"
          cp -r deploy "$name/deploy"
          cp README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          # Just the lab host, for the machine that runs the challenge containers.
          lab="kymo-lab-${TAG}-linux-x86_64"
          mkdir "$lab"
          cp target/release/kymo-lab "$lab/"
          cp deploy/lab/install-lab.sh deploy/lab/kymo-lab.service deploy/lab/lab.env.example "$lab/"
          cp deploy/lab/kymo-lab-firewall deploy/lab/kymo-lab-firewall.service "$lab/"
          cp -r deploy/lab/manifests "$lab/manifests"
          cp -r deploy/lab/verifiers "$lab/verifiers"
          cp -r deploy/vpn-gateway "$lab/vpn-gateway"
          # The Verifier image: its Dockerfile, the program and the helper libraries.
          mkdir "$lab/verifier"
          cp deploy/verifier/Dockerfile target/release/kymo-verifier "$lab/verifier/"
          cp -r crates/kymo-verifier/lib "$lab/verifier/lib"
          cp README.md LICENSE "$lab/"
          tar czf "$lab.tar.gz" "$lab"
          sha256sum "$lab.tar.gz" > "$lab.tar.gz.sha256"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          echo "LAB_ASSET=$lab.tar.gz" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Kymo ${{ env.TAG }}
          generate_release_notes: true
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
            ${{ env.LAB_ASSET }}
            ${{ env.LAB_ASSET }}.sha256
